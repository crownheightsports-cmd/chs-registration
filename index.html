<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Season Calendar — Crown Heights Sports</title>
<!-- Google tag (gtag.js) -->

  function gtag(){dataLayer.push(arguments);}

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0f2156; --navy-2:#16307a; --orange:#f47c20; --cream:#f7f6f3;
  --ink:#1a1a18; --muted:#6b6b60; --line:#e8e5df;
}
body{font-family:'DM Sans',sans-serif;background:var(--cream);min-height:100vh;color:var(--ink)}
.wrap{min-height:100vh}

/* HEADER */
.hdr{background:var(--navy);padding:1.6rem 2rem 1.2rem;position:relative;overflow:hidden}
.hdr::before{content:'';position:absolute;top:-60%;right:-8%;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, rgba(244,124,32,.22), transparent 70%)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;position:relative}
.hdr-left{display:flex;align-items:center;gap:14px}
.logo{height:42px;object-fit:contain;filter:drop-shadow(0 1px 4px rgba(0,0,0,.35))}
.hdr-title{font-family:'DM Serif Display',serif;font-size:1.75rem;color:#fff;font-weight:400;line-height:1.1}
.hdr-sub{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;align-items:center;gap:10px}
.nav-mo{font-family:'DM Serif Display',serif;font-size:1.25rem;color:#fff;min-width:170px;text-align:center}
.nbtn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);
  color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;transition:background .15s;line-height:1}
.nbtn:hover{background:rgba(255,255,255,.22)}

/* FILTER CHIPS */
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:1.3rem;position:relative}
.chip{
  display:flex;align-items:center;gap:8px;border-radius:999px;padding:7px 14px 7px 10px;cursor:pointer;
  border:1.5px solid transparent;background:rgba(255,255,255,.08);transition:all .18s;user-select:none;
}
.chip:hover{background:rgba(255,255,255,.16)}
.chip .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.chip .lbl{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.75);white-space:nowrap;transition:color .18s}
.chip.all.active{background:#fff}
.chip.all.active .lbl{color:var(--navy)}
.chip.on{border-color:currentColor}
.chip.on .lbl{color:#fff}
.chip.dim{opacity:.35}

/* SCOREBOARD STAT STRIP — shows when a single program is selected */
.stat-strip{
  max-width:1200px;margin:0 auto;padding:0 2rem;margin-top:-1px;
  display:grid;grid-template-columns:0fr;transition:grid-template-columns .28s ease;
}
.stat-strip.on{grid-template-columns:1fr}
.stat-inner{overflow:hidden}
.stat-card{
  margin-top:1rem;background:var(--ink);border-radius:12px;padding:14px 20px;
  display:flex;align-items:center;gap:28px;flex-wrap:wrap;
}
.stat-item{display:flex;flex-direction:column;gap:2px}
.stat-num{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:1.5rem;color:#fff;line-height:1}
.stat-lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.stat-next{font-size:13px;color:rgba(255,255,255,.85);margin-left:auto}
.stat-next b{color:#fff}

/* BODY / GRID */
.body{padding:1.5rem 2rem 3rem;max-width:1200px;margin:0 auto}
.dow-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px}
.dl{text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cell{
  min-height:98px;border-radius:10px;background:#fff;border:1px solid var(--line);
  padding:7px;display:flex;flex-direction:column;gap:3px;position:relative;transition:box-shadow .15s,border-color .15s;
}
.cell.empty{background:transparent;border-color:transparent}
.cell.hol-day{background:#fef2f2;border-color:#fca5a5;box-shadow:inset 3px 0 0 #dc2626}
.dn{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--muted);line-height:1;margin-bottom:2px}
.today-num{
  background:var(--orange);color:#fff;width:22px;height:22px;border-radius:6px;display:inline-flex;
  align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;margin-bottom:2px;
}
.pill{
  font-size:10px;font-weight:600;border-radius:5px;padding:3px 6px;display:block;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;line-height:1.5;transition:opacity .18s,transform .18s;
}
.pill.cancelled{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:#dc2626;background:#fee2e2!important;color:#991b1b!important;opacity:.85;font-weight:700}
.pill.faded{opacity:.15}
.pill.hero{transform:scale(1.03);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.hol-tag{font-size:9.5px;color:#fff;background:#dc2626;border-radius:4px;padding:2.5px 7px;display:inline-flex;align-items:center;gap:3px;font-weight:700;letter-spacing:.03em;line-height:1.6;margin-bottom:2px;text-transform:uppercase;box-shadow:0 1px 3px rgba(220,38,38,.35)}
.hol-tag::before{content:'⛔';font-size:8px}

.legend-note{font-size:11px;color:var(--muted);margin-top:1rem;display:flex;align-items:center;gap:6px}
.legend-note .sw{width:10px;height:10px;border-radius:3px;background:#fef2f2;border:1px solid #fca5a5;display:inline-block}

@media(max-width:800px){
  .body{padding:1rem}
  .hdr{padding:1.1rem 1.25rem}
  .nav-mo{min-width:120px}
  .stat-strip{padding:0 1rem}
  .stat-next{margin-left:0}
}
@media(max-width:520px){
  .cell{min-height:64px;padding:5px}
  .pill{font-size:9px;padding:2px 4px}
  .chip .lbl{font-size:11.5px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <div class="hdr-top">
      <div class="hdr-left">
        <img class="logo" src="https://images.squarespace-cdn.com/content/v1/646ad25d86d7905786f9751a/11baa6fc-4400-4043-8c1b-5d8ebde3df65/CHS+LOGO.png?format=200w" alt="CHS Logo">
        <div>
          <div class="hdr-title">Season Calendar</div>
          <div class="hdr-sub">2026–2027 Season</div>
        </div>
      </div>
      <div class="nav">
        <button class="nbtn" onclick="cm(-1)" aria-label="Previous month">&#8249;</button>
        <div class="nav-mo" id="navMo"></div>
        <button class="nbtn" onclick="cm(1)" aria-label="Next month">&#8250;</button>
      </div>
    </div>
    <div class="chip-row" id="chipRow"></div>
  </div>

  <div class="stat-strip" id="statStrip">
    <div class="stat-inner">
      <div class="stat-card" id="statCard"></div>
    </div>
  </div>

  <div class="body">
    <div class="dow-row">
      <div class="dl">Sun</div><div class="dl">Mon</div><div class="dl">Tue</div>
      <div class="dl">Wed</div><div class="dl">Thu</div><div class="dl">Fri</div><div class="dl">Sat</div>
    </div>
    <div class="cal-grid" id="grid"></div>
    <div class="legend-note"><span class="sw"></span> Shaded day = holiday closure (practice cancelled)</div>
  </div>

</div>
<script>
const PROGS=[
  {id:'toddler',n:'Toddler Soccer', meta:'Ages 3–5 · Sun 10–11am', dow:[0],   bg:'#e8edf8',c:'#0f2156'},
  {id:'boysS',  n:'Boys Soccer',    meta:'Pre-1A–8th · Sun & Wed', dow:[0,3], bg:'#dcf5e8',c:'#14532d'},
  {id:'girlsS', n:'Girls Soccer',   meta:'Pre-1A–8th · Mon 5–7pm', dow:[1],   bg:'#fef3c7',c:'#7c3d00',s:'gs',
   // Oct 12 – Nov 9: all grades together 5–6pm. From Nov 16: split by grade.
   slots:(y,m,d)=> new Date(y,m,d)<=new Date(2026,10,9)
     ? ['All grades 5–6pm']
     : ['Pre-1A–3rd 5–6pm','4th–8th 6–7pm']},
  {id:'boysB',  n:'Boys Basketball',meta:'1st–8th · Tue eves',dow:[2],bg:'#dbeafe',c:'#1e3a8a',s:'bb',
   // 6th–8th (Lubavitch Yeshiva) starts Oct 6; 1st–3rd and 4th–5th (German School) start Oct 13.
   slots:(y,m,d)=> new Date(y,m,d)<new Date(2026,9,13)
     ? ['6th–8th 7:30pm']
     : ['1st–3rd 5:30pm','4th–5th 6:30pm','6th–8th 7:30pm']},
  {id:'girlsB', n:'Girls Basketball',meta:'4th–8th · Wed 5:45–6:45pm',dow:[3],bg:'#fce7f3',c:'#9d174d',s:'gb'},
  {id:'mensB',  n:"Men's Basketball",meta:'Adults · Mon & Thu eves',dow:[1,4],bg:'#ede9fe',c:'#3b0764',s:'mb'},
];
const HOLS={
  '2026-09-13':'Rosh Hashana','2026-09-14':'Rosh Hashana',
  '2026-09-20':'Erev Yom Kippur','2026-09-21':'Yom Kippur',
  '2026-09-25':'Sukkos','2026-09-27':'Chol Hamoed','2026-09-28':'Chol Hamoed',
  '2026-09-29':'Chol Hamoed','2026-09-30':'Chol Hamoed','2026-10-01':'Chol Hamoed',
  '2026-10-04':'Simchat Torah','2026-10-05':'Isru Chag',
  '2026-12-20':'Tzom',
  '2027-02-08':'Midwinter',
  '2027-03-22':'Tzom Esther','2027-03-23':'Purim',
  '2027-04-21':'Erev Pesach','2027-04-22':'Pesach','2027-04-23':'Pesach',
  '2027-04-24':'Pesach','2027-04-25':'Pesach','2027-04-26':'Pesach',
  '2027-04-28':'Pesach','2027-04-29':'Pesach',
  '2027-05-02':'Isru Chag',"2027-05-24":"Lag B'Omer",
  '2027-06-10':'Erev Yom Tov','2027-06-11':'Shavuos',
};
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const _today=new Date();
let yr=_today.getFullYear(),mo=_today.getMonth();
let activeId='all'; // 'all' or a program id

function k(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function getH(y,m,d){return HOLS[k(y,m,d)]||'';}
function inS(p,y,m,d){
  const dt=new Date(y,m,d);
  if(p.s==='gs') return (dt>=new Date(2026,9,12)&&dt<=new Date(2026,10,18))||(dt>=new Date(2027,0,6)&&dt<=new Date(2027,2,31));
  if(p.s==='gb') return dt>=new Date(2026,9,14)&&dt<=new Date(2026,11,30);
  if(p.s==='mb') return dt>=new Date(2026,9,6)&&dt<=new Date(2027,2,31);
  if(p.s==='bb') return dt>=new Date(2026,9,6)&&dt<=new Date(2027,5,14);
  return dt>=new Date(2026,7,30)&&dt<=new Date(2027,5,14);
}

function renderChips(){
  const row=document.getElementById('chipRow');
  let html=`<div class="chip all ${activeId==='all'?'active':''}" onclick="selectProg('all')">
    <span class="lbl">All programs</span>
  </div>`;
  html+=PROGS.map(p=>{
    const isOn=activeId===p.id;
    const isDim=activeId!=='all' && !isOn;
    return `<div class="chip ${isOn?'on':''} ${isDim?'dim':''}" style="color:${p.c}" onclick="selectProg('${p.id}')">
      <span class="dot" style="background:${p.c}"></span>
      <span class="lbl">${p.n}</span>
    </div>`;
  }).join('');
  row.innerHTML=html;
}

function selectProg(id){
  activeId = (activeId===id) ? 'all' : id;
  renderChips();
  renderStat();
  render();
}

// Scoreboard-style stat readout: how many practices this program has in the
// visible month, plus its next upcoming date from today.
function renderStat(){
  const strip=document.getElementById('statStrip');
  const card=document.getElementById('statCard');
  if(activeId==='all'){ strip.classList.remove('on'); card.innerHTML=''; return; }
  const p=PROGS.find(x=>x.id===activeId);
  const dim=new Date(yr,mo+1,0).getDate();
  let countThisMonth=0;
  for(let d=1;d<=dim;d++){
    const dow=new Date(yr,mo,d).getDay();
    if(p.dow.includes(dow) && inS(p,yr,mo,d) && !getH(yr,mo,d)) countThisMonth++;
  }
  // Find next practice from real today, scanning forward up to a year
  const today=new Date(); today.setHours(0,0,0,0);
  let next=null;
  for(let i=0;i<370;i++){
    const dt=new Date(today); dt.setDate(today.getDate()+i);
    const dow=dt.getDay();
    if(p.dow.includes(dow) && inS(p,dt.getFullYear(),dt.getMonth(),dt.getDate()) && !getH(dt.getFullYear(),dt.getMonth(),dt.getDate())){
      next=dt; break;
    }
  }
  const nextLabel = next ? next.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}) : '—';
  strip.classList.add('on');
  card.innerHTML = `
    <div class="stat-item">
      <div class="stat-num">${countThisMonth}</div>
      <div class="stat-lbl">Practices in ${MN[mo]}</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" style="font-size:1.05rem">${(p.slots&&next)?next.toLocaleDateString('en-US',{weekday:'short'})+' · '+p.slots(next.getFullYear(),next.getMonth(),next.getDate()).join(' · '):(p.meta.split('·')[1]?.trim()||p.meta)}</div>
      <div class="stat-lbl">Schedule</div>
    </div>
    <div class="stat-next">Next up: <b>${nextLabel}</b></div>
  `;
}

function render(){
  document.getElementById('navMo').textContent=MN[mo]+' '+yr;
  const first=new Date(yr,mo,1).getDay(),dim=new Date(yr,mo+1,0).getDate(),ts=new Date().toDateString();
  let html='';
  for(let i=0;i<first;i++) html+='<div class="cell empty"></div>';
  for(let d=1;d<=dim;d++){
    const dow=new Date(yr,mo,d).getDay(),isT=new Date(yr,mo,d).toDateString()===ts;
    const hol=getH(yr,mo,d);
    const progs=PROGS.filter(p=>p.dow.includes(dow)&&inS(p,yr,mo,d));
    const dn=isT?`<div><span class="today-num">${d}</span></div>`:`<div class="dn">${d}</div>`;
    const htag=hol?`<span class="hol-tag">${hol}</span>`:'';
    const pills=progs.map(p=>{
      let cls='pill'+(hol?' cancelled':'');
      if(activeId!=='all'){
        cls += (p.id===activeId) ? ' hero' : ' faded';
      }
      const labels=p.slots?p.slots(yr,mo,d).map(t=>p.n+' · '+t):[p.n];
      return labels.map(t=>`<span class="${cls}" style="background:${p.bg};color:${p.c}" title="${t}">${t}</span>`).join('');
    }).join('');
    html+=`<div class="cell${hol?' hol-day':''}">${dn}${htag}${pills}</div>`;
  }
  document.getElementById('grid').innerHTML=html;
}
function cm(d){mo+=d;if(mo>11){mo=0;yr++;}if(mo<0){mo=11;yr--;}render();renderStat();}

renderChips();
render();
</script>
</body>
</html>
